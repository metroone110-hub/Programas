<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090c"/>
      <stop offset="50%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Orange-Gold Flame Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7900"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Luxury Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="url(#brand-grad)" stroke-width="10"/>

  <!-- Radial Ambient Aura -->
  <circle cx="256" cy="220" r="160" fill="#ea580c" opacity="0.22" filter="url(#glow)"/>

  <!-- Concentric Security Seal Ring -->
  <circle cx="256" cy="230" r="150" fill="none" stroke="url(#gold-foil)" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="230" r="132" fill="none" stroke="url(#gold-foil)" stroke-width="1.5" opacity="0.4"/>

  <!-- Official CROU Cutlery & Ticket Crest -->
  <g transform="translate(256, 210) scale(1.15)">
    <!-- Fork left -->
    <path d="M-55,-60 L-55,-20 C-55,-5 -45,5 -35,10 L-35,65 C-35,70 -38,75 -42,75 C-46,75 -50,70 -50,65 L-50,-20 C-50,-20 -50,-60 -50,-60" fill="url(#gold-foil)" opacity="0.4" transform="rotate(-30)"/>
    <!-- Spoon right -->
    <path d="M45,-60 C35,-60 30,-45 30,-30 C30,-15 40,-5 45,0 L45,65 C45,70 48,75 52,75 C56,75 60,70 60,65 L60,0 C65,-5 75,-15 75,-30 C75,-45 70,-60 60,-60 Z" fill="url(#gold-foil)" opacity="0.4" transform="rotate(30)"/>
  </g>

  <!-- Big Stylized "P" Monogram for PROGRAMAS -->
  <g transform="translate(256, 226)">
    <!-- Shadow -->
    <path d="M-60,-100 L25,-100 C75,-100 100,-75 100,-25 C100,25 75,50 25,50 L-10,50 L-10,105 L-60,105 Z" fill="#000000" opacity="0.6" transform="translate(4, 6)"/>
    <!-- Main P Shape -->
    <path d="M-60,-100 L25,-100 C75,-100 100,-75 100,-25 C100,25 75,50 25,50 L-10,50 L-10,105 L-60,105 Z" fill="url(#brand-grad)" stroke="url(#gold-foil)" stroke-width="5"/>
    <!-- P Inner Loop -->
    <path d="M-10,-55 L22,-55 C45,-55 55,-45 55,-25 C55,-5 45,5 22,5 L-10,5 Z" fill="#0b0b10" stroke="url(#gold-foil)" stroke-width="3"/>
    <!-- Ticket perforation holes in P stem -->
    <circle cx="-35" cy="-25" r="7" fill="#fbbf24"/>
    <circle cx="-35" cy="15" r="7" fill="#fbbf24"/>
    <circle cx="-35" cy="55" r="7" fill="#fbbf24"/>
  </g>

  <!-- Bottom Brand Ribbon: PROGRAMAS -->
  <rect x="76" y="390" width="360" height="66" rx="22" fill="#0c0d12" stroke="url(#brand-grad)" stroke-width="3"/>
  <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PROGRAMAS</text>

  <!-- Top Crown: CROU KORHOGO -->
  <rect x="146" y="42" width="220" height="34" rx="14" fill="#ff7900" opacity="0.95"/>
  <text x="256" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CROU-K UPGC</text>
</svg>